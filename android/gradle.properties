# Memoire Gradle : dimensionnee pour fonctionner dans un conteneur a ~7 Go
# comme sur les runners GitHub Actions (ubuntu-latest, 16 Go).
# Ne pas depasser -Xmx4g : au-dela, le daemon Gradle est tue par OOM
# dans les environnements contraints (constate en local, conteneur 7,8 Go).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m
android.useAndroidX=true
# Jetifier desactive : aucune dependance com.android.support (support library
# legacy) n'est utilisee par l'application ni par les 86 packages resolus.
# Le laisser actif declenchait JetifyTransform sur les .so natifs et epuisait
# le tas Java (Java heap space sur arm64_v8a_debug / x86_64_debug).
android.enableJetifier=false
org.gradle.daemon=false
org.gradle.workers.max=2
