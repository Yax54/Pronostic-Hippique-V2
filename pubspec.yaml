name: pronostic_hippique
description: Pronostic Hippique — Application IA de pronostics PMU.
publish_to: 'none'
version: 9.94.0+184

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: 6.1.5+1
  http: 1.5.0
  shared_preferences: 2.5.3
  url_launcher: 6.3.1
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  gal: ^2.3.2
  sqflite: ^2.4.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # ★ BLOC 1 (qualité) — analyse SYNTAXIQUE pour la garde des écrivains
  #   financiers (`test/c3_garde_ecriture_financiere_globale_test.dart`).
  #   Cette garde identifiait ses sites par `fichier:ligne`, donc elle
  #   échouait au moindre ajout d'accolade ou de ligne vide. Elle s'appuie
  #   désormais sur l'AST officiel : chemin + classe + méthode + champ +
  #   nature de l'écriture, sans aucun numéro de ligne.
  #   Dépendance de DÉVELOPPEMENT uniquement : rien n'entre dans l'APK.
  analyzer: ^7.7.1
  # ★ BLOC 1 (qualité) — FAUX CANAUX DE PLATEFORME UTILISÉS PAR LES TESTS.
  #   Les tests remplacent le canal `shared_preferences` / `path_provider` /
  #   `share_plus` par un faux en mémoire (store fautif, restauration,
  #   sauvegarde). Pour cela ils importent DIRECTEMENT les interfaces de
  #   plateforme. Ce sont des dépendances TRANSITIVES : les importer sans les
  #   déclarer est signalé par `depend_on_referenced_packages`.
  #
  #   Le dépôt contournait cela par `// ignore: depend_on_referenced_packages`
  #   (123 occurrences, toutes supprimées au BLOC 1). On déclare donc les
  #   paquets : c'est la seule façon de rendre l'analyse propre SANS masquer.
  #
  #   ⚠️ CONTRAINTES EXPLICITES, alignées sur la version RÉSOLUE.
  #      La contrainte d'un `platform_interface` est dictée par son paquet
  #      PARENT (`shared_preferences`, `path_provider`, `share_plus`), qui
  #      impose une plage étroite : les versions 2.x et 3.x des interfaces ne
  #      sont pas interchangeables, et `^3.x` casserait la résolution.
  #      On écrit donc `^<version résolue>` — marge de correctif uniquement :
  #        • shared_preferences_platform_interface  2.4.2 -> ^2.4.2
  #        • path_provider_platform_interface       2.1.2 -> ^2.1.2
  #        • share_plus_platform_interface          6.1.0 -> ^6.1.0
  #      Aucune montée de version n'est demandée : `pubspec.lock` doit
  #      demeurer inchangé sur ces trois paquets.
  shared_preferences_platform_interface: ^2.4.2
  path_provider_platform_interface: ^2.1.2
  share_plus_platform_interface: ^6.1.0
  sqflite_common_ffi: ^2.3.7+1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/
