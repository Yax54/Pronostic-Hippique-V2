name: pronostic_hippique
description: Pronostic Hippique — Application IA de pronostics PMU.
publish_to: 'none'
version: 9.94.0+184

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: 6.1.5+1
  http: 1.5.0
  shared_preferences: 2.5.3
  url_launcher: 6.3.1
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # ★ BLOC 1 (qualité) — analyse SYNTAXIQUE pour la garde des écrivains
  #   financiers (`test/c3_garde_ecriture_financiere_globale_test.dart`).
  #   Cette garde identifiait ses sites par `fichier:ligne`, donc elle
  #   échouait au moindre ajout d'accolade ou de ligne vide. Elle s'appuie
  #   désormais sur l'AST officiel : chemin + classe + méthode + champ +
  #   nature de l'écriture, sans aucun numéro de ligne.
  #   Dépendance de DÉVELOPPEMENT uniquement : rien n'entre dans l'APK.
  analyzer: ^7.0.0
  # ★ BLOC 1 (qualité) — FAUX CANAUX DE PLATEFORME UTILISÉS PAR LES TESTS.
  #   Les tests remplacent le canal `shared_preferences` / `path_provider` par
  #   un faux en mémoire (store fautif, restauration, sauvegarde). Pour cela
  #   ils importent DIRECTEMENT les interfaces de plateforme. Ce sont des
  #   dépendances TRANSITIVES : les importer sans les déclarer est signalé par
  #   `depend_on_referenced_packages`.
  #
  #   Le dépôt contournait cela par `// ignore: depend_on_referenced_packages`
  #   (123 occurrences dans 60 fichiers de test). La DIRECTIVE impose la voie
  #   `pubspec` plutôt que le masquage du diagnostic : on déclare donc les
  #   paquets. Ce sont des dépendances de DÉVELOPPEMENT, jamais embarquées
  #   dans l'APK.
  #
  #   Contraintes volontairement LARGES (`any` → version résolue actuelle
  #   conservée) : on ne veut AUCUNE montée de version, seulement la
  #   déclaration. `pubspec.lock` prouve qu'aucune version n'a bougé.
  shared_preferences_platform_interface: any
  path_provider_platform_interface: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/
