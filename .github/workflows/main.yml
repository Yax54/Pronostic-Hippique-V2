name: Build APK

# ═══════════════════════════════════════════════════════════════════════════
#  POURQUOI CE DÉCLENCHEUR N'EST PLUS `push: branches: [main]`
#
#  Ce workflow compilait un APK à CHAQUE push sur `main`. Un push devenait donc
#  une compilation Android, ce que la consigne de sauvegarde interdit
#  explicitement (« ne déclenche aucun workflow de génération APK »).
#
#  Le déclenchement passe en MANUEL (`workflow_dispatch`) : la capacité de
#  produire un APK est conservée à l'identique — aucune étape, aucune version
#  d'outil, aucun artefact n'est retiré — mais elle ne se produit plus à
#  l'occasion d'une sauvegarde de code.
#
#  ⚠️ Aucune autre modification : les étapes, leurs versions et l'artefact
#     produit sont inchangés.
# ═══════════════════════════════════════════════════════════════════════════
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      - name: Verify toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Verify APK exists
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          ls -l "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
